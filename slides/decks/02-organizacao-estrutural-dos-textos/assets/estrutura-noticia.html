<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body { margin: 0; background: #222222; font-family: 'Inter', sans-serif; }
svg { display: block; }
.pyramid-layer { stroke: #FF904D; stroke-width: 2; }
.pyramid-layer:hover { fill: rgba(255, 144, 77, 0.25) !important; }
.layer-title { fill: #FF904D; font-size: 36px; font-weight: 700; text-anchor: middle; }
.layer-subtitle { fill: #FFC766; font-size: 20px; font-weight: 600; text-anchor: middle; }
.layer-desc { fill: rgba(255,255,255,0.9); font-size: 18px; text-anchor: middle; line-height: 1.5; }
.layer-detail { fill: rgba(255,255,255,0.7); font-size: 16px; text-anchor: middle; line-height: 1.4; }
.icon { fill: #FF904D; }
.icon-bg { fill: rgba(255, 144, 77, 0.15); stroke: #FF904D; stroke-width: 1.5; }
.w5h { fill: rgba(255, 144, 77, 0.1); stroke: #FF904D; stroke-width: 1; stroke-dasharray: 4,2; }
.w5h-label { fill: #FFC766; font-size: 14px; font-weight: 600; text-anchor: middle; }
.accent-line { stroke: #FF904D; stroke-width: 3; }
</style>
</head>
<body>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const width = 1920, height = 800;
const svg = d3.select("body").append("svg").attr("width", width).attr("height", height);

const cx = width / 2;
const topY = 100;
const bottomY = 700;
const topW = 1200;
const bottomW = 200;

const layers = [
  { 
    id: 0, label: "TÍTULO", 
    subtitle: "O gancho — fato principal em uma linha",
    desc: "Resume o acontecimento essencial",
    detail: "Deve responder: o quê? (às vezes quem?)",
    y: topY + 40, h: 140,
    wTop: topW, wBottom: topW * 0.75,
    icon: "M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v16M4 8h16"
  },
  { 
    id: 1, label: "LIDE (LEAD)", 
    subtitle: "Os 5W1H no 1º parágrafo — a informação que não pode faltar",
    desc: "Concentra o essencial: quem, o quê, quando, onde, como, por quê",
    detail: "Pode ser lido isolado e ainda informar o fato completo",
    y: topY + 180, h: 200,
    wTop: topW * 0.75, wBottom: topW * 0.4,
    icon: "M11 4a2 2 0 1 1 4 0v1.5M7 4h10M7 4v1.5M17 10v4a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-4M7 10l5 5 5-5"
  },
  { 
    id: 2, label: "CORPO", 
    subtitle: "Detalhes, citações, contexto, consequências — o que enriquece",
    desc: "Expande o lide com profundidade, vozes e cenário",
    detail: "Pode ser cortado pelo editor sem perder a notícia essencial",
    y: topY + 380, h: 280,
    wTop: topW * 0.4, wBottom: bottomW,
    icon: "M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v16M6 14h12M6 18h12M6 10h12"
  }
];

const pyramid = svg.append("g");

layers.forEach((layer, i) => {
  const g = pyramid.append("g");
  const wT = layer.wTop;
  const wB = layer.wBottom;
  const y = layer.y;
  const h = layer.h;
  
  const points = [
    cx - wT/2, y,
    cx + wT/2, y,
    cx + wB/2, y + h,
    cx - wB/2, y + h
  ].join(" ");
  
  g.append("polygon")
    .attr("class", "pyramid-layer")
    .attr("points", points)
    .attr("fill", `rgba(255, 144, 77, ${0.08 + i * 0.04})`);
  
  const textY = y + h/2 - 20;
  
  g.append("circle")
    .attr("class", "icon-bg")
    .attr("cx", cx - wT/2 - 80)
    .attr("cy", textY + 10)
    .attr("r", 35);
  
  g.append("path")
    .attr("class", "icon")
    .attr("d", layer.icon)
    .attr("transform", `translate(${cx - wT/2 - 92}, ${textY - 12}) scale(0.7)`);
  
  g.append("text")
    .attr("class", "layer-title")
    .attr("x", cx)
    .attr("y", textY - 30)
    .text(layer.label);
  
  g.append("text")
    .attr("class", "layer-subtitle")
    .attr("x", cx)
    .attr("y", textY + 15)
    .text(layer.subtitle);
  
  g.append("text")
    .attr("class", "layer-desc")
    .attr("x", cx)
    .attr("y", textY + 50)
    .text(layer.desc);
  
  g.append("text")
    .attr("class", "layer-detail")
    .attr("x", cx)
    .attr("y", textY + 80)
    .text(layer.detail);
  
  if (i === 1) {
    const w5h = ["QUEM", "O QUÊ", "QUANDO", "ONDE", "COMO", "POR QUÊ"];
    const boxW = (wT * 0.75 - 40) / 3;
    const boxH = 50;
    const startX = cx - (wT * 0.75 - 40) / 2;
    const baseY = y + h - 80;
    
    w5h.forEach((w, idx) => {
      const col = idx % 3;
      const row = Math.floor(idx / 3);
      const bx = startX + col * (boxW + 20) + boxW/2;
      const by = baseY + row * (boxH + 15) + boxH/2;
      
      g.append("rect")
        .attr("class", "w5h")
        .attr("x", bx - boxW/2)
        .attr("y", by - boxH/2)
        .attr("width", boxW)
        .attr("height", boxH)
        .attr("rx", 8)
        .attr("ry", 8);
      
      g.append("text")
        .attr("class", "w5h-label")
        .attr("x", bx)
        .attr("y", by + 5)
        .text(w);
    });
  }
});

svg.append("line")
  .attr("class", "accent-line")
  .attr("x1", cx - 200)
  .attr("y1", topY - 30)
  .attr("x2", cx + 200)
  .attr("y2", topY - 30);

svg.append("text")
  .attr("class", "layer-title")
  .attr("x", cx)
  .attr("y", topY - 45)
  .text("PIRÂMIDE INVERTIDA DA NOTÍCIA");

svg.append("text")
  .attr("class", "layer-subtitle")
  .attr("x", cx)
  .attr("y", topY - 10)
  .text("Informação essencial no topo → detalhes na base");
</script>
</body>
</html>
