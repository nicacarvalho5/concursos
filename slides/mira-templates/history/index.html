<!DOCTYPE html>
<html lang="pt-BR" data-mira-deck-id="__MIRA_SLUG__">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>__MIRA_TITULO__</title>

<!-- ==========================================================
     MIRA-HISTORY · deck de história animada
     ----------------------------------------------------------
     Este arquivo é FIXO. Quem conta a história é mira/historia.js
     (dados: atores, lugares, cenas, legendas) e quem anima é
     mira/mira-history.js (runtime versionado do Mira).

     Os símbolos dos atores vêm de mira/atores.js, gerado pelo script
     ator.mjs da skill a partir de assets/atores/*.svg. Não edite à mão.
     ========================================================== -->

<link rel="stylesheet" href="assets/vendor/patrick-hand.css">
<script src="assets/vendor/qrcode-generator.js"></script>

<style>
/* @MIRA:THEME:START */
:root {
    --mira-primary: #FFB300;
    --mira-accent: #38BDF8;
    --mira-accent-2: #FF7B54;
    --mira-bg: #070913;
    --mira-text: #FFFFFF;
    --mira-conto: #FFF6D8;
}
/* @MIRA:THEME:END */

:root {
    --vh: 100vh;
    --fmt-w: min(100vw, calc(var(--vh) * 16 / 9));
    --fmt-h: calc(var(--fmt-w) * 9 / 16);
}
/* altura estável no celular: não muda quando a barra do navegador some (evita o quadro pular) */
@supports (height: 100svh) { :root { --vh: 100svh; } }
* { margin: 0; padding: 0; box-sizing: border-box; }
html {
    background: #000;
    scroll-behavior: smooth;
    scroll-snap-type: y proximity;
    scrollbar-width: none;
    overflow-x: hidden;
    /* a navegação é só pelos botões, setas e deslizar horizontal: o dedo não rola a página
       (rolagem parcial fazia a cena "sair" da tela e reiniciar, piscando) */
    overflow-y: hidden;
    overscroll-behavior: none;
}
html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
body {
    background: #000;
    color: var(--mira-text);
    font-family: 'Patrick Hand', 'Segoe Print', 'Comic Sans MS', cursive;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}
#mira-nav, .btn-comecar, .btn-inicio { touch-action: manipulation; }
body > section {
    position: relative;
    width: var(--fmt-w);
    height: var(--fmt-h);
    min-height: var(--fmt-h);
    margin: calc((var(--vh) - var(--fmt-h)) / 2) 0;
    scroll-margin-top: calc((var(--vh) - var(--fmt-h)) / 2);
    overflow: hidden;
    background: var(--mira-bg);
    scroll-snap-align: start;
    isolation: isolate;
}
:fullscreen body > section, :-webkit-full-screen body > section { margin: calc((var(--vh) - var(--fmt-h)) / 2) 0; }
.anim-stage { position: absolute; inset: 0; z-index: 1; }
.anim-stage svg { width: 100%; height: 100%; display: block; }
#mira-atores { position: absolute; width: 0; height: 0; overflow: hidden; }

/* título da capa balanceado (diretriz de capa) */
body > section:first-of-type h1, body > section:first-of-type h2, .conto.capa .frase.titulo { text-wrap: balance; }

/* legenda de conto: texto solto no céu, sem caixa */
.conto { position: absolute; left: 5%; top: 7%; width: 42%; z-index: 5; pointer-events: none; }
.conto .frase {
    position: absolute; left: 0; top: 0; width: 100%;
    font-size: calc(var(--fmt-h) * 0.06);
    line-height: 1.25;
    color: var(--mira-conto);
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.75), 0 0 22px rgba(0, 0, 0, 0.5);
    opacity: 0;
}
.conto.capa { left: 0; width: 100%; top: 6%; text-align: center; }
.conto.capa .frase.titulo {
    font-size: calc(var(--fmt-h) * 0.115);
    line-height: 1.05;
    white-space: pre-line;
    letter-spacing: 0.01em;
    padding: 0 8%;
    text-shadow: 0 3px 10px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 179, 0, 0.35);
}
.conto.capa .frase.sub { top: calc(var(--fmt-h) * 0.26); font-size: calc(var(--fmt-h) * 0.046); color: rgba(255, 246, 216, 0.85); }
.conto .frase.fim {
    left: -11.9%; width: 238%;
    top: calc(var(--fmt-h) * 0.5);
    text-align: center;
    font-size: calc(var(--fmt-h) * 0.19);
    line-height: 1;
    letter-spacing: 0.08em;
    text-shadow: 0 3px 10px rgba(0, 0, 0, 0.7), 0 0 40px rgba(255, 179, 0, 0.35);
}

/* QR da capa, lado esquerdo, só quando aberto pelo servidor na rede */
.qr-capa[hidden] { display: none; }
.qr-capa { position: absolute; left: 4.5%; top: 50%; transform: translateY(-50%); z-index: 6; display: flex; flex-direction: column; align-items: center; gap: calc(var(--fmt-h) * 0.012); pointer-events: none; }
.qr-cartao {
    --qr-lado: calc(var(--fmt-h) * 0.30);
    width: var(--qr-lado); height: var(--qr-lado);
    padding: calc(var(--qr-lado) * 0.09);
    background: #FFF; border-radius: calc(var(--fmt-h) * 0.02);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.55), 0 0 0 3px rgba(255, 246, 216, 0.55);
    animation: qr-brilho 3.2s ease-in-out infinite;
}
.qr-cartao svg { display: block; width: 100%; height: 100%; }
.qr-dica { font-size: calc(var(--fmt-h) * 0.032); color: rgba(255, 246, 216, 0.9); text-shadow: 0 2px 6px rgba(0, 0, 0, 0.75); max-width: calc(var(--fmt-h) * 0.34); text-align: center; line-height: 1.15; }
@keyframes qr-brilho {
    0%, 100% { box-shadow: 0 8px 30px rgba(0, 0, 0, 0.55), 0 0 0 3px rgba(255, 246, 216, 0.55); }
    50% { box-shadow: 0 8px 30px rgba(0, 0, 0, 0.55), 0 0 22px 4px rgba(255, 179, 0, 0.55); }
}

/* botões da história: Começar (capa) e Voltar ao início (fim) */
.btn-comecar, .btn-inicio {
    position: absolute; left: 50%; transform: translateX(-50%); z-index: 6;
    font-family: inherit; font-size: calc(var(--fmt-h) * 0.05);
    color: var(--mira-conto);
    background: rgba(255, 246, 216, 0.14);
    border: 2px solid rgba(255, 246, 216, 0.8);
    border-radius: 9999px;
    padding: calc(var(--fmt-h) * 0.014) calc(var(--fmt-h) * 0.06);
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
    cursor: pointer; opacity: 0; pointer-events: none;
    transition: opacity 0.9s ease, background 0.25s ease, transform 0.25s ease;
}
.btn-inicio { top: 84%; }
.btn-inicio.on { opacity: 1; pointer-events: auto; }
.btn-inicio:hover { background: rgba(255, 179, 0, 0.32); transform: translateX(-50%) scale(1.04); }
/* capa: os dois botões lado a lado (empilham em tela estreita) */
.capa-botoes { position: absolute; left: 50%; top: 76%; transform: translateX(-50%); z-index: 6; display: flex; gap: calc(var(--fmt-h) * 0.03); flex-wrap: wrap; justify-content: center; width: 90%; opacity: 0; pointer-events: none; transition: opacity 0.9s ease; }
.capa-botoes.on { opacity: 1; pointer-events: auto; }
.capa-botoes .btn-comecar { position: static; transform: none; opacity: 1; pointer-events: auto; }
.capa-botoes .btn-comecar:hover { background: rgba(255, 179, 0, 0.32); transform: scale(1.04); }
.capa-botoes.on .btn-comecar:not(.btn-auto-capa) { animation: comecar-pulsa 1.6s ease-in-out infinite; }
.btn-auto-capa { background: rgba(56, 189, 248, 0.16); border-color: rgba(56, 189, 248, 0.85); }
@keyframes comecar-pulsa { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 179, 0, 0); } 50% { box-shadow: 0 0 22px 6px rgba(255, 179, 0, 0.45); } }

/* dissolve entre cortes (View Transitions) e véu de fallback */
::view-transition-old(root), ::view-transition-new(root) { animation-duration: 0.9s; }
#mira-progress { view-transition-name: mira-progress; }
#mira-nav { view-transition-name: mira-nav; }
#mira-veu { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 9990; transition: opacity 0.42s ease; }
#mira-veu.on { opacity: 1; }

#mira-progress { position: fixed; top: 0; left: 0; height: 3px; width: 0%; background: linear-gradient(90deg, #38BDF8, #FFB300, #FF7B54); z-index: 9999; transition: width 0.15s linear; }

/* navegação */
#mira-nav { position: fixed; bottom: 24px; right: 28px; display: flex; gap: 10px; z-index: 9998; opacity: 0.35; transition: opacity 0.3s ease; }
#mira-nav:hover, #mira-nav.pronto { opacity: 1; }
.nav-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(10, 12, 24, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.16);
    color: #FFF; display: flex; align-items: center; justify-content: center;
    cursor: pointer; backdrop-filter: blur(10px); transition: all 0.25s ease;
}
.nav-btn:hover { background: rgba(255, 179, 0, 0.25); border-color: var(--mira-primary); transform: translateY(-2px); }
.nav-btn svg { width: 18px; height: 18px; }
.nav-btn.on { background: rgba(56, 189, 248, 0.35); border-color: #38BDF8; }
#mira-next:not(.pronto) { opacity: 0.3; cursor: default; }
.nav-btn.pronto { background: rgba(34, 197, 94, 0.35); border-color: #22C55E; color: #FFF; animation: pronto-pulsa 1.3s ease-in-out infinite; }
@keyframes pronto-pulsa {
    0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0), 0 0 10px 2px rgba(34, 197, 94, 0.45); transform: scale(1); }
    50% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0), 0 0 22px 6px rgba(34, 197, 94, 0.85); transform: scale(1.08); }
}
body.pausado #mira-nav { opacity: 1; }
/* tela de toque: barra sempre visível e botões maiores (regra depois de .nav-btn, para vencer) */
/* toque: sem estado de hover (o "hover" preso depois do toque fazia o botão pular) */
@media (hover: none) {
    .nav-btn:hover { transform: none; background: rgba(10, 12, 24, 0.85); border-color: rgba(255, 255, 255, 0.16); }
    .capa-botoes .btn-comecar:hover, .btn-inicio:hover { transform: none; background: rgba(255, 246, 216, 0.14); }
    #mira-nav { opacity: 1; bottom: 16px; right: 16px; gap: 12px; }
    #mira-nav .nav-btn { width: 50px; height: 50px; backdrop-filter: none; background: rgba(10, 12, 24, 0.85); }
    #mira-nav .nav-btn svg { width: 22px; height: 22px; }
}
/* celular estreito: botões menores para a barra caber (8 botões) */
@media (hover: none) and (max-width: 600px) {
    #mira-nav { gap: 5px; right: 8px; bottom: 10px; }
    #mira-nav .nav-btn { width: 40px; height: 40px; }
    #mira-nav .nav-btn svg { width: 18px; height: 18px; }
}
/* celular em pé: a história é 16:9, pede paisagem */
#mira-gire { display: none; position: fixed; left: 50%; top: 12px; transform: translateX(-50%); z-index: 9997; font-size: 15px; color: var(--mira-conto); background: rgba(10, 12, 24, 0.75); border: 1px solid rgba(255, 246, 216, 0.5); border-radius: 9999px; padding: 6px 14px; pointer-events: none; white-space: nowrap; }
@media (hover: none) and (orientation: portrait) { #mira-gire { display: block; } }
body.mira-teste #mira-nav, body.mira-teste #mira-progress, body.mira-teste #mira-gire { display: none; }
/* modo vídeo (video.mjs do /mira-history): só a cena, sem controle nenhum */
body.mira-video #mira-nav, body.mira-video #mira-progress, body.mira-video #mira-gire, body.mira-video .capa-botoes, body.mira-video .btn-inicio, body.mira-video .qr-capa { display: none !important; }
body.mira-video { background: #000; }
</style>
</head>
<body>

<div id="mira-progress"></div>
<div id="mira-gire">Gire o celular para ver a história maior</div>
<audio id="mira-musica" loop preload="auto"></audio>

<div id="mira-nav">
    <button class="nav-btn" id="mira-som" aria-label="Ligar ou desligar o som" title="Som (tecla M)">
        <svg id="mira-som-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 5a9 9 0 0 1 0 14"></path></svg>
        <svg id="mira-som-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
    </button>
    <button class="nav-btn" id="mira-auto" aria-label="Modo automático" title="Tocar tudo sozinho (tecla A)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon><line x1="21" y1="3" x2="21" y2="21"></line></svg>
    </button>
    <button class="nav-btn" id="mira-prev" aria-label="Cena anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <button class="nav-btn" id="mira-pausa" aria-label="Pausar ou continuar" title="Pausar (barra de espaço)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="9" y1="5" x2="9" y2="19"></line><line x1="15" y1="5" x2="15" y2="19"></line></svg>
    </button>
    <button class="nav-btn" id="mira-replay" aria-label="Reiniciar cena" title="Reiniciar a cena (tecla R)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
    </button>
    <button class="nav-btn" id="mira-tela" aria-label="Tela cheia" title="Tela cheia (tecla F)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"></path><path d="M21 8V5a2 2 0 0 0-2-2h-3"></path><path d="M3 16v3a2 2 0 0 0 2 2h3"></path><path d="M16 21h3a2 2 0 0 0 2-2v-3"></path></svg>
    </button>
    <button class="nav-btn" id="mira-next" aria-label="Próxima cena">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
</div>

<!-- as <section> das cenas nascem aqui, uma por cena de mira/historia.js -->
<div id="mira-cenas"></div>

<!-- os símbolos dos atores (mira/atores.js, gerado por ator.mjs) são montados aqui pelo runtime -->
<svg id="mira-atores" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true"></svg>

<script src="mira/historia.js"></script>
<script src="mira/atores.js"></script>
<script src="mira/narracao.js"></script>
<script src="mira/mira-history.js"></script>

<!-- Scripts de autoria do Mira (tecla E edita, tecla P pinta) -->
<script defer src="mira/mira-edit.js"></script>
<script defer src="mira/mira-edit-free.js"></script>
<script defer src="mira/mira-draw.js"></script>
</body>
</html>
